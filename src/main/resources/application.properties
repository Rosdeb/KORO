app.rate-limit.search.user-monthly-limit=${SEARCH_USER_MONTHLY_LIMIT:500}
app.rate-limit.search.anon-daily-limit=${SEARCH_ANON_DAILY_LIMIT:15}
app.rate-limit.search.anon-monthly-limit=${SEARCH_ANON_MONTHLY_LIMIT:150}

# Google Gemini Multi-Model AI Translation Fallback
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.models=${GEMINI_MODELS:gemini-3.8-flash,gemini-3.5-flash,gemini-flash-latest,gemini-pro-latest}
