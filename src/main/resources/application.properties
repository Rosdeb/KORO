spring.application.name=koro

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/koro}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom application properties
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
app.vision.mock-enabled=${VISION_MOCK_ENABLED:true}
app.vision.api-key=${VISION_API_KEY:mock-key}
